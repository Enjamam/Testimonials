<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Website - Customer Testimonials Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background: #f8fafc;
            color: #0f172a;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .embed-container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            overflow: hidden;
            padding: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Customer Testimonials Embed Verification</h1>
            <p>Demonstrating third-party website embed functionality via script tag and iframe isolation.</p>
        </div>
        <div class="embed-container">
            <!-- Testimonial Wall Embed -->
            <div id="testimonials-wall" data-space="demo-space" data-height="600"></div>
        </div>
    </div>
    <script src="/embed.js" async></script>
</body>
</html>
